[package]
name = "gnat-overlay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A click-through wlr-layer-shell overlay surface for the fly to walk on."

[dependencies]
anyhow.workspace = true
# No default features: `calloop` (we drive our own blocking dispatch loop) and
# `xkbcommon` (the overlay never takes keyboard focus) both pull in system
# libraries this crate has no use for.
smithay-client-toolkit = { version = "0.21", default-features = false }
wayland-client = "0.31"
